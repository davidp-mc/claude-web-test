name: Deploy to GitHub Pages

# This workflow can be triggered manually from the Actions tab
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          # Set the base path to match your repository name
          # For project pages (username.github.io/repo-name): use '/repo-name/'
          # For user pages (username.github.io): use '/'
          VITE_BASE_PATH: '/claude-web-test/'
        run: npm run build

      - name: Verify build output
        run: |
          echo "📦 Build completed. Checking output..."
          ls -la dist/
          echo "📄 Index.html content preview:"
          head -n 20 dist/index.html
          echo "✅ Build verification complete"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features Available:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Subscription Plans Display" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Admin Panel (bottom-right)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stripe Payment Integration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Card:** 4242 4242 4242 4242" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Application deployed to: ${{ steps.deployment.outputs.page_url }}"
